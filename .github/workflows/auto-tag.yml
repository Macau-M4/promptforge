name: Auto-tag new prompts

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run auto-tagger and annotate the PR
        run: node scripts/ci-annotate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
